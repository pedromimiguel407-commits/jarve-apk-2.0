name: Build JARVES Linux AppImage

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'ai/**'
      - 'database/**'
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/linux-appimage.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Linux AppImage
        run: npm run build:linux
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: JARVES-AI-2.3.2-Linux-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
